# ---------------------------------------------------------------------------------------------------------------------
#  App settings -- the ONE place for addresses and tunable numbers. Edit a value here and rebuild; no code changes.
#
#  The build turns every line into a constant (com.huynhdous.employeefield.core.config.Config) that the app uses.
#  To try a different value on your own machine only (e.g. a test server), put the same key in
#  app-config.local.properties next to this file -- it overrides this one and is not meant to be shared.
#  Every key below is required: the build stops with a clear message if one is missing.
# ---------------------------------------------------------------------------------------------------------------------

# ---- Server -------------------------------------------------------------------------------------------------------
# The employee API (must end with a slash).
api.base_url=https://jobportal.huynhdous.com/api/employee/

# ---- Maps and address lookup --------------------------------------------------------------------------------------
# Map picture tiles ({z}/{x}/{y} are filled in by the map) and the credit line shown on the map (HTML: &copy; shows as the copyright sign).
map.tile_url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
map.attribution=&copy; OpenStreetMap
# Finds the street address for a GPS position (used when starting a door).
geocode.reverse_url=https://nominatim.openstreetmap.org/reverse
# Opens Street View in a browser when the Google Maps app is not installed. %s,%s = latitude,longitude.
streetview.web_url=https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=%s,%s

# ---- Location tracking --------------------------------------------------------------------------------------------
# How many GPS positions are recorded and uploaded per minute (1 = about every 60 seconds, 2 = every 30 seconds).
tracking.positions_per_minute=1

# ---- Photos --------------------------------------------------------------------------------------------------------
# Photos are shrunk on the phone before upload: longest side in pixels, and JPEG quality (1-100).
photo.max_edge_px=1600
photo.jpeg_quality=85

# ---- Doors (D2D) and check-in -------------------------------------------------------------------------------------
# A door photo taken farther than this from the door is flagged for the manager (metres).
door.photo_proximity_meters=100
# The most store photos one check-in can have.
checkin.max_store_photos=10
# How long the phone waits for a good GPS fix before giving up at check-in/out (seconds).
checkin.location_timeout_seconds=20

# ---- Work hours shown in the app ----------------------------------------------------------------------------------
# Targets for the "Today" and "This Week" rings when no shifts are scheduled (minutes).
work.daily_target_minutes=480
work.weekly_target_minutes=2400

# ---- Meal-break reminder ------------------------------------------------------------------------------------------
# How often the phone checks whether a meal break is due (minutes), and the window after clocking in when it reminds (hours).
meal.check_interval_minutes=15
meal.window_start_hours=3.0
meal.window_end_hours=5.0
